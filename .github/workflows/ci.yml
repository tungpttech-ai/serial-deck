name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ipc=${{ matrix.ipc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        # tcp is the Windows hub transport; on POSIX it also runs against real PTYs.
        ipc: [native, tcp]
        exclude:
          - os: windows-latest
            ipc: native    # Windows has only the tcp transport
          - os: macos-latest
            ipc: tcp
          - os: ubuntu-latest
            python: "3.10"
            ipc: tcp
    env:
      SERIAL_DECK_IPC: ${{ matrix.ipc == 'tcp' && 'tcp' || '' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[mcp]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  package:
    name: Build and smoke-test the wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -f "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -c "import serial_deck.web as w; assert (w.ASSET_ROOT / 'vendor' / 'SHA256SUMS').is_file()"
          "$PY" -m serial_deck.hub --help > /dev/null
          "$PY" -m serial_deck.uart_client --help > /dev/null
          "$PY" -m serial_deck.flash --help > /dev/null
