[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-deck"
dynamic = ["version"]
description = "Shared serial console: one UART hub for many dashboards, a Web/Desktop UI, ESP32 flashing and an MCP server for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "serial_deck/web_assets/vendor/**/LICENSE*"]
requires-python = ">=3.10"
keywords = ["serial", "uart", "esp32", "esptool", "console", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Terminals :: Serial",
]
dependencies = [
    "pyserial>=3.5",
    "esptool>=5.0,<6",
]

[project.optional-dependencies]
app = ["pywebview>=5.0,<7"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
serial-deck = "serial_deck.uart_client:main"
serial-deck-hub = "serial_deck.hub:main"
serial-deck-web = "serial_deck.web:main"
serial-deck-desktop = "serial_deck.desktop_hub:main"
serial-deck-flash = "serial_deck.flash:main"
serial-deck-mcp = "serial_deck.mcp_server:main"

[project.gui-scripts]
serial-deck-app = "serial_deck.app:main"

[project.urls]
Homepage = "https://github.com/tungpttech-ai/serial-deck"
Issues = "https://github.com/tungpttech-ai/serial-deck/issues"

[tool.setuptools]
packages = ["serial_deck"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "serial_deck.__version__"}

[tool.setuptools.package-data]
serial_deck = ["web_assets/**/*"]
